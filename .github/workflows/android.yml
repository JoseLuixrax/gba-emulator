name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # "Run workflow" button in the Actions tab. Tick "release" to publish
  # a GitHub Release tagged v<versionName> without pushing a tag yourself.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag v<versionName>)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MGBA_VERSION: "0.10.5"

jobs:
  # Runs the emulation core on Linux with the test ROMs in native-test/roms.
  native-tests:
    name: Native core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mGBA sources
        run: |
          mkdir -p third_party
          curl -sSL "https://github.com/mgba-emu/mgba/archive/refs/tags/${MGBA_VERSION}.tar.gz" | tar xz -C third_party
          mv "third_party/mgba-${MGBA_VERSION}" third_party/mgba

      - name: Build test harness
        run: |
          cmake -S native-test -B build/native-test -DCMAKE_BUILD_TYPE=Release -DMGBA_DIR="$PWD/third_party/mgba"
          cmake --build build/native-test -j"$(nproc)"

      - name: Run test ROMs
        run: ./build/native-test/host_test native-test/roms build/native-test/out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-screenshots
          path: build/native-test/out/*.png
          if-no-files-found: ignore

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          NAME="AdvanceBoy-${VERSION}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          # Same file under a fixed name for releases, so
          # .../releases/latest/download/AdvanceBoy.apk always points to the newest one.
          cp app/build/outputs/apk/release/app-release.apk AdvanceBoy.apk
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdvanceBoy-apk
          path: ${{ steps.apk.outputs.name }}

      # Pushing a tag like v1.0.0 (or running the workflow with "release"
      # ticked) publishes a GitHub Release with the APK, easy to download
      # straight from the phone.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AdvanceBoy ${{ steps.apk.outputs.tag }}
          files: AdvanceBoy.apk
          body: |
            Descarga **AdvanceBoy.apk** (abajo, en *Assets*) desde el móvil e instálalo.
            Android pedirá permitir *instalar apps desconocidas* para el navegador o el gestor de archivos.

            Enlace fijo a la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/AdvanceBoy.apk

            Requiere Android 8.0 o superior. Se instala encima de versiones anteriores sin perder partidas.
